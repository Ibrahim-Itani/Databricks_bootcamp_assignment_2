<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Document Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .search-box {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .input-group input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: border-color 0.3s;
        }
        
        .input-group input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .slider-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .slider-group input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #e0e0e0;
            outline: none;
            -webkit-appearance: none;
        }
        
        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }
        
        .slider-group input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }
        
        .slider-value {
            font-weight: 600;
            color: #667eea;
            min-width: 30px;
            text-align: center;
        }
        
        .search-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .search-btn:active {
            transform: translateY(0);
        }
        
        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }
        
        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }
        
        .results {
            margin-top: 20px;
        }
        
        .result-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .result-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }
        
        .result-title {
            flex: 1;
        }
        
        .result-title h3 {
            color: #333;
            font-size: 1.3rem;
            margin-bottom: 5px;
        }
        
        .result-location {
            color: #667eea;
            font-size: 0.95rem;
            font-weight: 500;
        }
        
        .similarity-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .result-text {
            color: #555;
            line-height: 1.6;
            margin-top: 10px;
        }
        
        .result-date {
            color: #999;
            font-size: 0.85rem;
            margin-top: 10px;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
            color: #666;
        }
        
        .no-results h3 {
            margin-bottom: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ Weather Document Search</h1>
            <p>Semantic search over weather alerts and forecasts</p>
        </div>
        
        <div class="search-box">
            <div class="input-group">
                <label for="query">Search Query</label>
                <input 
                    type="text" 
                    id="query" 
                    placeholder="e.g., heat advisory in Chicago, fog warning, severe weather..."
                    autocomplete="off"
                >
            </div>
            
            <div class="input-group">
                <label for="topK">Number of Results: <span class="slider-value" id="topKValue">5</span></label>
                <div class="slider-group">
                    <input 
                        type="range" 
                        id="topK" 
                        min="1" 
                        max="20" 
                        value="5"
                    >
                </div>
            </div>
            
            <button class="search-btn" id="searchBtn" onclick="performSearch()">
                Search
            </button>
        </div>
        
        <div id="resultsContainer"></div>
    </div>
    
    <script>
        // Update slider value display
        const topKSlider = document.getElementById('topK');
        const topKValue = document.getElementById('topKValue');
        
        topKSlider.addEventListener('input', (e) => {
            topKValue.textContent = e.target.value;
        });
        
        // Allow Enter key to trigger search
        document.getElementById('query').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
        
        async function performSearch() {
            const query = document.getElementById('query').value.trim();
            const topK = parseInt(document.getElementById('topK').value);
            const resultsContainer = document.getElementById('resultsContainer');
            const searchBtn = document.getElementById('searchBtn');
            
            if (!query) {
                resultsContainer.innerHTML = '<div class="error-message">Please enter a search query</div>';
                return;
            }
            
            // Show loading state
            searchBtn.disabled = true;
            searchBtn.textContent = 'Searching';
            resultsContainer.innerHTML = '<div class="loading">Searching for relevant weather documents</div>';
            
            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query, top_k: topK })
                });
                
                const data = await response.json();
                
                if (!data.success) {
                    resultsContainer.innerHTML = `<div class="error-message"><strong>Error:</strong> ${data.error}</div>`;
                    return;
                }
                
                if (data.results.length === 0) {
                    resultsContainer.innerHTML = `
                        <div class="no-results">
                            <h3>No results found</h3>
                            <p>${data.message || 'Try a different search query'}</p>
                        </div>
                    `;
                    return;
                }
                
                // Display results
                let html = '<div class="results">';
                data.results.forEach((result, index) => {
                    const similarity = (result.similarity * 100).toFixed(1);
                    const date = result.published_utc ? new Date(result.published_utc).toLocaleDateString() : 'N/A';
                    
                    html += `
                        <div class="result-card">
                            <div class="result-header">
                                <div class="result-title">
                                    <h3>${escapeHtml(result.headline)}</h3>
                                    <div class="result-location">📍 ${escapeHtml(result.location)}</div>
                                </div>
                                <div class="similarity-badge">${similarity}%</div>
                            </div>
                            <div class="result-text">${escapeHtml(result.chunk_text || 'No description available')}</div>
                            <div class="result-date">📅 ${date}</div>
                        </div>
                    `;
                });
                html += '</div>';
                
                resultsContainer.innerHTML = html;
                
            } catch (error) {
                resultsContainer.innerHTML = `<div class="error-message"><strong>Error:</strong> ${error.message}</div>`;
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
